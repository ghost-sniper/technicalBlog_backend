name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      run: |
        rustup toolchain install 1.97.0 --profile minimal
        rustup default 1.97.0
    - name: Run tests
      run: cargo test --locked --verbose
    - name: Docker Build
      run: docker build -f ./DockerFile -t blog:${{ github.sha }} .
